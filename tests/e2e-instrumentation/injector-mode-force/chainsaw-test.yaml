# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: injector-mode-force
spec:
  steps:
    - name: Install instrumentation CR with mode=Install
      try:
        - apply:
            file: 00-install-instrumentation.yaml
      cleanup:
        - delete:
            ref:
              apiVersion: opentelemetry.io/v2alpha1
              kind: Instrumentation
              name: injector-mode-force
    - name: Deploy Java app with existing agent
      try:
        - apply:
            file: 01-install-app.yaml
        - assert:
            file: 01-assert.yaml
      catch:
        - podLogs:
            selector: app=java-app-force
    - name: Verify injector forced injection despite existing javaagent
      try:
        - script:
            timeout: 60s
            content: |
              #!/bin/bash
              set -e

              kubectl wait --for=condition=Ready pod -l app=java-app-force \
                -n ${NAMESPACE} --timeout=120s

              LOGS=$(kubectl logs -n ${NAMESPACE} -l app=java-app-force -c myapp)

              echo "Pod logs:"
              echo "$LOGS"

              # In install (force) mode, the injector should add our javaagent
              # even though a foreign one is already present.
              if echo "$LOGS" | grep -q "/otel/javaagent.jar"; then
                echo "OK: injector correctly forced injection of our javaagent"
              else
                echo "FAIL: injector did not add our javaagent in install (force) mode"
                exit 1
              fi

              # The original agent should also still be present (we append, not replace).
              if echo "$LOGS" | grep -q "/app/other-agent.jar"; then
                echo "OK: original javaagent also preserved"
              else
                echo "FAIL: original javaagent was lost"
                exit 1
              fi
