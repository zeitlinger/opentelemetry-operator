apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-app-force
spec:
  selector:
    matchLabels:
      app: java-app-force
  replicas: 1
  template:
    metadata:
      labels:
        app: java-app-force
    spec:
      containers:
        - name: myapp
          image: busybox:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "JAVA_TOOL_OPTIONS=$JAVA_TOOL_OPTIONS"
              sleep 3600
          env:
            # Simulate existing manual instrumentation — a foreign javaagent.
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/app/other-agent.jar"
