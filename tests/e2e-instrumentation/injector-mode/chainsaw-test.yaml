# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: injector-mode
spec:
  steps:
    - name: step-00
      try:
        - apply:
            file: 00-install-instrumentation.yaml
      cleanup:
        - delete:
            ref:
              apiVersion: opentelemetry.io/v2alpha1
              kind: Instrumentation
              name: injector-mode
    - name: step-01
      try:
        - apply:
            file: 01-install-app.yaml
        - assert:
            file: 01-assert.yaml
      catch:
        - podLogs:
            selector: app=my-app
    - name: Verify mode values are correct
      try:
        - script:
            timeout: 30s
            content: |
              #!/bin/bash
              set -e

              # Verify myapp container has OTEL_INJECTOR_MODE=install (inherited from CR default)
              MODE=$(kubectl get pod -n ${NAMESPACE} -l app=my-app \
                -o jsonpath='{.items[0].spec.containers[?(@.name=="myapp")].env[?(@.name=="OTEL_INJECTOR_MODE")].value}')
              if [ "$MODE" != "install" ]; then
                echo "FAIL: myapp OTEL_INJECTOR_MODE='$MODE', expected 'install'"
                exit 1
              fi
              echo "OK: myapp has OTEL_INJECTOR_MODE=install (inherited from defaults.mode)"

              # Verify sidecar container was NOT injected (mode=Skip)
              SIDECAR_ENV=$(kubectl get pod -n ${NAMESPACE} -l app=my-app \
                -o jsonpath='{.items[0].spec.containers[?(@.name=="sidecar")].env[*].name}')
              if echo "$SIDECAR_ENV" | grep -q "LD_PRELOAD"; then
                echo "FAIL: sidecar has LD_PRELOAD but mode=Skip should suppress injection"
                exit 1
              fi
              if echo "$SIDECAR_ENV" | grep -q "OTEL_INJECTOR_MODE"; then
                echo "FAIL: sidecar has OTEL_INJECTOR_MODE but mode=Skip should suppress injection"
                exit 1
              fi
              echo "OK: sidecar container correctly skipped (mode=Skip overrides CR default)"
