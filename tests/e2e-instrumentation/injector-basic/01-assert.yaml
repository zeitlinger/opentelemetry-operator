apiVersion: v1
kind: Pod
metadata:
  labels:
    app: my-app
spec:
  containers:
    - name: myapp
      env:
        - name: LD_PRELOAD
          value: /otel/autoinstrumentation/libotelinject.so
        - name: OTEL_INJECTOR_CONFIG_FILE
          value: /otel/autoinstrumentation/injector/otelinject.conf
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: http/protobuf
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector:4318
        - name: OTEL_TRACES_SAMPLER
          value: always_on
        - name: OTEL_INJECTOR_K8S_CONTAINER_NAME
          value: myapp
        - name: OTEL_INJECTOR_SERVICE_NAME
          value: my-app
      volumeMounts:
        - name: otel-injector
          mountPath: /otel
          readOnly: true
  volumes:
    - name: otel-injector
      image:
        reference: busybox:latest
status:
  phase: Running
