apiVersion: opentelemetry.io/v2alpha1
kind: Instrumentation
metadata:
  name: injector-basic
spec:
  injector: busybox:latest
  rules:
    - name: catch-all
      config:
        env:
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://otel-collector:4318
          - name: OTEL_TRACES_SAMPLER
            value: always_on
