# Update the CR spec to bump generation — this should clear the rollback.
apiVersion: opentelemetry.io/v2alpha1
kind: Instrumentation
metadata:
  name: injector-rollback
spec:
  injector: busybox:latest
  defaults:
    rollback:
      enabled: true
      graceTime: 10s
      stabilityWindow: 5m
  rules:
    - name: catch-all
      config:
        env:
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://localhost:4318
          # Add an extra env var to bump the generation.
          - name: OTEL_TRACES_SAMPLER
            value: always_on
