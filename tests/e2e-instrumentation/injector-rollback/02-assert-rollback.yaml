# After rollback, the Instrumentation status should have a rolled-back workload.
apiVersion: instrumentation.opentelemetry.io/v2alpha1
kind: Instrumentation
metadata:
  name: injector-rollback
status:
  instrumentedWorkloads:
    - workloadRef:
        kind: Deployment
        name: crash-app
      rollback:
        reason: CrashLoopBackOff
