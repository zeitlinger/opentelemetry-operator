apiVersion: opentelemetry.io/v2alpha1
kind: Instrumentation
metadata:
  name: injector-mode-conflict
spec:
  # The injector image must be the locally-built one with mode support.
  # See HACKATHON.md for build instructions.
  injector: local/injector:dev
  java: local/injector-java:dev
  rules:
    - name: conflict-test
      config:
        env:
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://otel-collector:4318
