apiVersion: instrumentation.opentelemetry.io/v2alpha1
kind: Instrumentation
metadata:
  name: injector-mode-conflict
spec:
  injector: "{{INJECTOR_IMG}}"
  java: "{{INJECTOR_JAVA_IMG}}"
  rules:
    - name: force-install
      selector:
        podLabels:
          test-mode: install
      config:
        mode: install
    - name: conflict-aware
      selector:
        podLabels:
          test-mode: install-unless-conflict
      config:
        mode: install_unless_conflict
