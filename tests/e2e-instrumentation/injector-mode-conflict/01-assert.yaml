apiVersion: v1
kind: Pod
metadata:
  labels:
    app: java-app-with-agent
spec:
  containers:
    - name: myapp
      env:
        - name: LD_PRELOAD
          value: /otel/libotelinject.so
        - name: OTEL_INJECTOR_CONFIG_FILE
          value: /otel/injector/otelinject.conf
        - name: OTEL_INJECTOR_MODE
          value: install_unless_conflict
      volumeMounts:
        - name: otel-injector
          mountPath: /otel
  initContainers:
    - name: otel-injector-init
status:
  phase: Running
