apiVersion: v1
kind: Pod
metadata:
  labels:
    app: my-app
spec:
  containers:
    - name: myapp
      env:
        - name: LD_PRELOAD
          value: /otel/autoinstrumentation/libotelinject.so
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector:4318
        - name: OTEL_INJECTOR_K8S_CONTAINER_NAME
          value: myapp
      volumeMounts:
        - name: otel-injector
          mountPath: /otel
          readOnly: true
    - name: sidecar
  volumes:
    - name: otel-injector
      image:
        reference: busybox:latest
status:
  phase: Running
