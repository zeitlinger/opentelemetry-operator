apiVersion: v1
kind: Pod
metadata:
  labels:
    app: my-app
spec:
  containers:
    - name: myapp
      env:
        - name: LD_PRELOAD
          value: /otel/libotelinject.so
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector:4318
        - name: OTEL_INJECTOR_K8S_CONTAINER_NAME
          value: myapp
      volumeMounts:
        - name: otel-injector
          mountPath: /otel
    - name: sidecar
  initContainers:
    - name: otel-injector-init
status:
  phase: Running
