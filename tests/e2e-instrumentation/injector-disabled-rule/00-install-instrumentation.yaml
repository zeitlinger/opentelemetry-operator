apiVersion: opentelemetry.io/v2alpha1
kind: Instrumentation
metadata:
  name: injector-disabled-rule
spec:
  injector:
    image: busybox:latest
  rules:
    - name: skip-sidecar
      selector:
        containerNames:
          - sidecar
      config:
        disabled: true
    - name: catch-all
      config:
        env:
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://otel-collector:4318
