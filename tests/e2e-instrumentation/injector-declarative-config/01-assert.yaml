apiVersion: v1
kind: Pod
metadata:
  labels:
    app: my-app
spec:
  containers:
    - name: myapp
      env:
        - name: LD_PRELOAD
          value: /otel/autoinstrumentation/libotelinject.so
        - name: OTEL_INJECTOR_CONFIG_FILE
          value: /otel/injector/otelinject.conf
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector:4318
        - name: OTEL_CONFIG_FILE
          value: /otel/config/otel-config.yaml
        - name: OTEL_EXPERIMENTAL_CONFIG_FILE
          value: /otel/config/otel-config.yaml
        - name: OTEL_INJECTOR_K8S_CONTAINER_NAME
          value: myapp
        - name: OTEL_INJECTOR_SERVICE_NAME
          value: my-app
        - name: OTEL_INJECTOR_SERVICE_NAMESPACE
        - name: OTEL_INJECTOR_RESOURCE_ATTRIBUTES
      volumeMounts:
        - name: otel-injector
          mountPath: /otel
          readOnly: true
        - name: otel-config-with-config
          mountPath: /otel/config
          readOnly: true
  volumes:
    - name: otel-injector
      image:
        reference: busybox:latest
    - name: otel-config-with-config
      configMap:
        name: otel-injector-injector-declarative-config-with-config
status:
  phase: Running
