apiVersion: v1
kind: Pod
metadata:
  labels:
    app: frontend
spec:
  containers:
    - name: myapp
      env:
        - name: LD_PRELOAD
          value: /otel/autoinstrumentation/libotelinject.so
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector:4318
        - name: OTEL_INJECTOR_SERVICE_NAME
          value: frontend-app
      volumeMounts:
        - name: otel-injector
          mountPath: /otel
          readOnly: true
  volumes:
    - name: otel-injector
      image:
        reference: busybox:latest
status:
  phase: Running
