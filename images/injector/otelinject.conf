# Default agent paths for the init-container injection model.
# The operator's init container runs: cp -r /autoinstrumentation/. /otel
# After the copy, agents are available under /otel/ with the layout below.
#
# These defaults match the layout defined by the images in images/injector-{lang}/.
# The operator overrides these via environment variables when per-language images are configured:
#   JVM_AUTO_INSTRUMENTATION_AGENT_PATH
#   NODEJS_AUTO_INSTRUMENTATION_AGENT_PATH
#   PYTHON_AUTO_INSTRUMENTATION_AGENT_PATH_PREFIX
#   DOTNET_AUTO_INSTRUMENTATION_AGENT_PATH_PREFIX
jvm_auto_instrumentation_agent_path=/otel/javaagent.jar
nodejs_auto_instrumentation_agent_path=/otel/register.js
python_auto_instrumentation_agent_path_prefix=/otel/python
dotnet_auto_instrumentation_agent_path_prefix=/otel/dotnet
